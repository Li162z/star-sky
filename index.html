<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星空 · 许愿</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#03030a;}
  canvas{display:block;position:fixed;inset:0;}
  #bar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
       display:flex;gap:8px;width:min(90vw,420px);z-index:2;}
  #wish{flex:1;padding:12px 14px;border-radius:22px;border:1px solid rgba(255,255,255,.25);
        background:rgba(255,255,255,.08);color:#eaeaff;font-size:16px;outline:none;}
  #wish::placeholder{color:rgba(255,255,255,.45);}
  #send{padding:12px 18px;border-radius:22px;border:0;cursor:pointer;
        background:rgba(255,255,255,.9);color:#111;font-size:16px;}
  #tip{position:fixed;top:18px;left:0;right:0;text-align:center;
       color:rgba(255,255,255,.35);font-size:13px;
       font-family:system-ui,sans-serif;pointer-events:none;z-index:2;}
</style>
</head>
<body>
<div id="tip">点击夜空，流星会更多</div>
<div id="bar">
  <input id="wish" placeholder="写下你的愿望…" maxlength="24">
  <button id="send">放飞</button>
</div>
<canvas id="sky"></canvas>

<script>
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d');
let W, H, DPR = 1;

// 按屏幕像素密度渲染，字才清晰
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize(); addEventListener('resize', resize);

// 星星
let stars = [];
for(let i=0;i<220;i++){
  stars.push({x:Math.random(), y:Math.random(), r:Math.random()*1.2+.3, p:Math.random()*6.28});
}

// 流星：全部同一个角度，只在横向轨道上错开 → 永远平行，不会交叉
const DEG = 40 * Math.PI/180;
const SPDIRX = -Math.cos(DEG), SPDIRY = Math.sin(DEG);   // 飞行方向：左下
const NX = Math.sin(DEG), NY = Math.cos(DEG);            // 轨道横向坐标

let meteors = [];
let trackU = 0;

function makeMeteor(uIn, kIn){
  const sp = 3.0 + Math.random()*1.5;
  const uMax = W*NX + H*NY;
  const space = 56;                        // 相邻轨道间距，越小越密

  trackU += space;
  if(trackU > uMax + space) trackU = Math.random()*space;

  const u = (uIn === undefined) ? trackU + (Math.random()-0.5)*8 : uIn;
  const k = (kIn === undefined) ? Math.max(W,H)*(0.35 + Math.random()*1.0) : kIn;

  return {
    x: u*NX + k*Math.cos(DEG),
    y: u*NY - k*Math.sin(DEG),
    vx: SPDIRX*sp,
    vy: SPDIRY*sp,
    len: 200 + Math.random()*300,
    w: 1 + Math.random()*0.8,
    flick: Math.random()*6.28,
    freq: 3 + Math.random()*3
  };
}
for(let i=0;i<20;i++) meteors.push(makeMeteor());
setInterval(function(){ if(meteors.length < 60) meteors.push(makeMeteor()); }, 220);

// 点夜空：沿着经过那个点的那条轨道来一颗
cv.addEventListener('click', function(e){
  const u = e.clientX*NX + e.clientY*NY;
  meteors.push(makeMeteor(u, Math.max(W,H)*0.9));
});

// 许愿：文字在屏幕中间亮起来，发光停一下，再淡掉
const wishes = [];
const input = document.getElementById('wish');
function sendWish(){
  const t = input.value.trim();
  if(!t) return;
  wishes.push({text: t, start: performance.now()});
  meteors.push(makeMeteor());
  input.value = '';
}
document.getElementById('send').addEventListener('click', sendWish);
input.addEventListener('keydown', function(e){ if(e.key === 'Enter') sendWish(); });

function bg(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05060f');
  g.addColorStop(.6,'#080a1a');
  g.addColorStop(1,'#0b0b18');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

function draw(t){
  bg();
  for(const s of stars){
    ctx.globalAlpha = .35 + .65*Math.abs(Math.sin(t/1200 + s.p));
    ctx.fillStyle = '#dfe6ff';
    ctx.beginPath();
    ctx.arc(s.x*W, s.y*H, s.r, 0, 6.29);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 愿望文字（白金）
  const now = performance.now();
  ctx.textAlign = 'center';
  for(let i=wishes.length-1;i>=0;i--){
    const w = wishes[i];
    const e = now - w.start;
    let alpha;
    if(e < 500) alpha = e/500;
    else if(e < 2200) alpha = 1;
    else if(e < 4300) alpha = 1 - (e-2200)/2100;
    else { wishes.splice(i,1); continue; }

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '600 15px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.shadowColor = 'rgba(255,228,170,.85)';
    ctx.shadowBlur = 10 + 4*Math.sin(now/320);
    ctx.fillStyle = '#fff6e0';
    ctx.fillText(w.text, W/2, H*0.38 + i*26);
    ctx.restore();
  }
  ctx.textAlign = 'start';

  // 流星
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.x += m.vx; m.y += m.vy;
    const d = Math.hypot(m.vx, m.vy);
    const tx = m.x - m.vx/d*m.len, ty = m.y - m.vy/d*m.len;
    const k = 0.78 + 0.22*Math.abs(Math.sin(now/1000*m.freq + m.flick));

    const g = ctx.createLinearGradient(tx,ty,m.x,m.y);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(.55,'rgba(205,220,255,' + (0.25*k) + ')');
    g.addColorStop(.9,'rgba(235,242,255,' + (0.7*k) + ')');
    g.addColorStop(1,'rgba(255,255,255,' + (0.95*k) + ')');
    ctx.strokeStyle = g;
    ctx.lineWidth = m.w;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(m.x,m.y); ctx.stroke();

    const hg = ctx.createRadialGradient(m.x,m.y,0,m.x,m.y,10*m.w);
    hg.addColorStop(0,'rgba(255,255,255,' + k + ')');
    hg.addColorStop(.35,'rgba(215,228,255,' + (0.55*k) + ')');
    hg.addColorStop(1,'rgba(170,190,255,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(m.x,m.y,10*m.w,0,6.29); ctx.fill();

    if(m.x < -600 || m.y > H+600) meteors.splice(i,1);
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
